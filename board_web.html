<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="referrer" content="no-referrer">
<title>BoardHub</title>
<style>{{CSS}}</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <button type="button" class="mobile utility" id="nav-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="侧栏">☰</button>
    <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span>BoardHub</span>
  </div>
  <div class="top-status" id="top-status" aria-label="服务状态"></div>
  <div class="top-tools">
    <label class="search"><span aria-hidden="true" class="search-mark"></span><input id="search" type="search" aria-label="搜索消息" placeholder="搜索消息" autocomplete="off"><kbd>⌘ K</kbd></label>
    <button type="button" class="utility theme" id="theme" aria-label="切换主题" title="切换主题">◐</button>
    <button type="button" class="mobile utility" id="detail-toggle" aria-controls="inspector" aria-expanded="false">详情</button>
  </div>
</header>
<div class="workspace">
  <aside class="sidebar" id="sidebar" aria-label="看板导航">
    <div class="sidebar-scroll">
      <div class="quick">
        <button type="button" class="nav-row decision-nav" id="decisions-nav"><span class="nav-icon" aria-hidden="true">◇</span><span>待你决定</span><span class="number-pill" id="decision-count">0</span></button>
        <button type="button" class="nav-row" id="recent-nav"><span class="nav-icon" aria-hidden="true">≡</span><span>最近 7 天全部消息</span></button>
      </div>
      <section class="nav-section" aria-labelledby="agents-title"><h2 id="agents-title">成员</h2><div id="agents"></div></section>
      <section class="nav-section" aria-labelledby="threads-title"><h2 id="threads-title">会话</h2><div id="threads"></div></section>
      <section class="nav-section" aria-labelledby="filters-title"><h2 id="filters-title">任务状态</h2><div id="filters"></div></section>
    </div>
    <footer id="updated" class="sidebar-footer"></footer>
  </aside>
  <main class="conversation">
    <header class="conversation-head">
      <div class="conversation-heading"><h1 id="view-title">最近 7 天全部消息</h1><p id="view-caption"></p></div>
      <button type="button" class="secondary" id="new-message">新消息</button>
    </header>
    <div class="attention-banner"><span aria-hidden="true">◇</span><p>这里的决定会通知各 agent；涉及测试集、下载、服务器配置、删除的操作，仍需你在执行它的那个会话里亲口确认。</p></div>
    <div id="timeline" class="timeline" tabindex="0" aria-label="消息时间线"><div id="messages" class="messages"><p class="empty">正在读取看板…</p></div></div>
    <div class="composer-area">
      <form id="composer" class="composer" hidden>
        <div class="composer-head">
          <strong id="sending-as"></strong>
          <label>收件人 <select name="to" required></select></label>
          <label>类型 <select name="type" required><option value="info">消息</option><option value="question">问题</option><option value="task">任务</option><option value="decision">决定</option></select></label>
        </div>
        <div class="task-fields" id="task-fields" hidden>
          <label>任务名称<input name="title" maxlength="160"></label>
          <label>完成标准<textarea name="criteria" rows="2"></textarea></label>
        </div>
        <label class="compose-body"><span class="sr-only">消息正文</span><textarea name="body" rows="2" placeholder="输入消息，可用 @成员 指定收件人"></textarea></label>
        <div class="composer-foot"><span id="composer-help">Enter 发送 · Shift + Enter 换行</span><button type="submit" class="primary">发送 <span aria-hidden="true">↵</span></button></div>
      </form>
      <p id="status" class="status" role="status" hidden></p>
    </div>
  </main>
  <aside class="inspector" id="inspector" aria-labelledby="inspector-title">
    <header class="inspector-head"><h2 id="inspector-title">会话详情</h2><button type="button" class="mobile utility" id="detail-close" aria-label="关闭详情">×</button></header>
    <div id="details" class="details"><p class="subtle">选择会话或一条消息以查看详情。</p></div>
  </aside>
</div>
<dialog id="file-dialog" aria-labelledby="file-name"><div class="dialog-head"><h2 id="file-name"></h2><form method="dialog"><button class="secondary" type="submit">关闭</button></form></div><div id="file-content"></div></dialog>
<noscript>请启用 JavaScript 查看 BoardHub。</noscript>
<script type="application/json" id="board-data">{{DATA}}</script>
<script>{{JS}}</script>
</body>
</html>
