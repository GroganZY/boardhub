<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="referrer" content="no-referrer">
<title>BoardHub</title>
<style>{{CSS}}</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <button type="button" class="mobile utility" id="nav-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="侧栏">☰</button>
    <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span>BoardHub</span>
  </div>
  <div class="top-status" id="top-status" aria-label="服务状态"></div>
  <div class="top-tools">
    <label class="search"><span aria-hidden="true" class="search-mark"></span><input id="search" type="search" aria-label="搜索消息" placeholder="搜索消息" autocomplete="off"><kbd>⌘ K</kbd></label>
    <button type="button" class="utility theme" id="theme" aria-label="切换主题" title="切换主题">◐</button>
    <button type="button" class="mobile utility" id="detail-toggle" aria-controls="inspector" aria-expanded="false">详情</button>
  </div>
</header>
<div class="workspace">
  <aside class="sidebar" id="sidebar" aria-label="看板导航">
    <div class="group-switcher">
      <button type="button" class="group-button" id="group-button" aria-haspopup="menu" aria-expanded="false" aria-controls="group-menu">
        <span class="group-mark" id="group-mark" aria-hidden="true">群</span>
        <span class="group-text"><span class="group-name" id="group-name">群聊</span><small id="group-meta">群聊</small></span>
        <span class="group-caret" aria-hidden="true">▾</span>
      </button>
      <div class="group-menu" id="group-menu" role="menu" hidden></div>
    </div>
    <div class="sidebar-scroll">
      <section class="nav-section first" aria-labelledby="views-title"><h2 id="views-title">视图</h2>
      <div class="quick">
        <button type="button" class="nav-row decision-nav" id="decisions-nav" title="需要你同意、拒绝或修改的事项"><span class="nav-icon" aria-hidden="true">◇</span><span>待你决定</span><span class="number-pill" id="decision-count">0</span></button>
        <button type="button" class="nav-row" id="mainline-nav" title="你与 Claude 的对话，agent 活动折叠在中间"><span class="nav-icon" aria-hidden="true">◎</span><span>主线</span></button>
        <button type="button" class="nav-row" id="overview-nav" title="最近 7 天按话题汇总的群消息"><span class="nav-icon" aria-hidden="true">▦</span><span>群聊概览</span></button>
        <button type="button" class="nav-row" id="recent-nav" title="最近 7 天全部群消息，按时间排列"><span class="nav-icon" aria-hidden="true">≡</span><span>全部消息</span></button>
      </div>
      </section>
      <section class="nav-section" aria-labelledby="agents-title"><h2 id="agents-title">成员与会话</h2><div id="agents"></div></section>
      <section class="nav-section" aria-labelledby="threads-title"><h2 id="threads-title">话题</h2><div id="threads"></div></section>
      <section class="nav-section" aria-labelledby="filters-title"><h2 id="filters-title">任务状态</h2><div id="filters"></div></section>
    </div>
    <footer id="updated" class="sidebar-footer"></footer>
  </aside>
  <main class="conversation">
    <header class="conversation-head">
      <div class="conversation-heading"><h1 id="view-title">群聊概览</h1><p id="view-caption"></p></div>
      <div class="view-tools" id="view-tools"></div>
      <button type="button" class="secondary" id="new-message">发群消息</button>
    </header>
    <div id="timeline" class="timeline" tabindex="0" aria-label="消息时间线"><div id="messages" class="messages"><p class="empty">正在读取看板…</p></div></div>
    <div class="composer-area">
      <p id="mainline-hint" class="readonly-hint" hidden>主线只读。在 Claude 桌面版里继续对话。</p>
      <form id="composer" class="composer" hidden>
        <div class="composer-title">
          <strong id="composer-title">发到群</strong>
          <span id="sending-as"></span>
        </div>
        <p class="composer-explainer">消息写入项目留言板，值班员会叫醒收件人。</p>
        <div class="composer-head">
          <label>收件人 <select name="to" required aria-describedby="delivery-hint"></select></label>
          <label>类型 <select name="type" required><option value="info">消息</option><option value="question">问题</option><option value="task">任务</option><option value="decision">决定</option></select></label>
        </div>
        <p class="delivery-hint" id="delivery-hint" hidden></p>
        <div class="task-fields" id="task-fields" hidden>
          <label>任务名称<input name="title" maxlength="160"></label>
          <label>完成标准<textarea name="criteria" rows="2"></textarea></label>
        </div>
        <label class="compose-body"><span class="sr-only">消息正文</span><textarea name="body" rows="2" placeholder="输入消息，可用 @成员 指定收件人"></textarea></label>
        <div class="composer-foot"><span id="composer-help">Enter 发送 · Shift + Enter 换行</span><button type="submit" class="primary">发送 <span aria-hidden="true">↵</span></button></div>
      </form>
      <p id="status" class="status" role="status" hidden></p>
    </div>
  </main>
  <aside class="inspector" id="inspector" aria-labelledby="inspector-title">
    <header class="inspector-head"><h2 id="inspector-title">话题详情</h2><button type="button" class="mobile utility" id="detail-close" aria-label="关闭详情">×</button></header>
    <div id="details" class="details"><p class="subtle">选择话题或一条消息以查看详情。</p></div>
  </aside>
</div>
<dialog id="file-dialog" aria-labelledby="file-name"><div class="dialog-head"><h2 id="file-name"></h2><form method="dialog"><button class="secondary" type="submit">关闭</button></form></div><div id="file-content"></div></dialog>
<noscript>请启用 JavaScript 查看 BoardHub。</noscript>
<script type="application/json" id="board-data">{{DATA}}</script>
<script>{{JS}}</script>
</body>
</html>
